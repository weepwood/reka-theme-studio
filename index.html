<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f9" />
    <meta name="description" content="基于 Vue 3 + Reka UI 的多主题交互设计系统演示。" />
    <title>Theme Studio — Reka UI Foundation</title>
    <script>
      // Prevent a light-theme flash before Vue is mounted.
      try {
        const available = ['porcelain', 'midnight', 'lavender', 'parchment', 'evergreen', 'brutalist', 'boardui'];
        const stored = localStorage.getItem('reka-theme-studio-theme');
        document.documentElement.dataset.theme = available.includes(stored) ? stored : 'porcelain';
      } catch {
        document.documentElement.dataset.theme = 'porcelain';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
